<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨水屏相框</title>
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --line: #333;
    --text: #ececec;
    --dim: #9a9a9a;
    --accent: #f2c14e;
    --ok: #58c47a;
    --err: #e5655e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 14px 40px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 19px; margin: 4px 0 2px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; margin-bottom: 14px;
  }
  .preview {
    width: 100%; aspect-ratio: 768 / 552; border-radius: 8px;
    background: #fff; display: block; image-rendering: pixelated;
  }
  .ph {
    width: 100%; aspect-ratio: 768 / 552; border-radius: 8px;
    background: #0d0d0d; border: 1px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 14px; text-align: center; padding: 20px;
  }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  button, .pick {
    flex: 1; appearance: none; border: 0; border-radius: 10px;
    padding: 13px 10px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #1a1a1a; text-align: center;
    cursor: pointer; user-select: none;
  }
  button:disabled { opacity: .45; }
  button.ghost, .pick.ghost {
    background: transparent; color: var(--text); border: 1px solid var(--line);
  }
  input[type=file] { display: none; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.busy { background: var(--accent); animation: blink 1s infinite; }
  .dot.err { background: var(--err); }
  @keyframes blink { 50% { opacity: .25; } }
  .meta { color: var(--dim); font-size: 12px; margin-top: 8px; word-break: break-all; }
  details summary {
    cursor: pointer; color: var(--dim); font-size: 14px; outline: none;
  }
  label { display: block; font-size: 13px; color: var(--dim); margin: 12px 0 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 11px 12px; font-size: 15px;
    background: #151515; color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
  }
  .hint { font-size: 12px; color: var(--dim); margin-top: 6px; }

  .qhead {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; margin-bottom: 4px;
  }
  .qrow {
    display: grid; grid-template-columns: 46px 1fr 42px;
    align-items: center; gap: 10px; margin-top: 10px;
    font-size: 13px; color: var(--dim);
  }
  .qrow b { color: var(--text); font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 22px;
    background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px; background: #3a3a3a;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); margin-top: -7px; border: 0;
  }
  button.small { flex: none; padding: 5px 10px; font-size: 12px; font-weight: 500; }
</style>
</head>
<body>

<h1>墨水屏相框</h1>
<div class="sub">选择一张照片，浏览器直接算出黑/白/黄/红四色画面再发给设备，屏幕所见即所得。</div>

<div class="card">
  <div id="ph" class="ph">还没有选择图片</div>
  <canvas id="cv" class="preview" width="768" height="552" style="display:none"></canvas>

  <div class="row">
    <label class="pick" for="file">选择照片</label>
    <button id="send" disabled>发送到屏幕</button>
  </div>
  <input id="file" type="file" accept="image/*">
  <div class="meta" id="size"></div>
</div>

<div class="card">
  <div class="qhead">
    <span>画质</span>
    <button class="ghost small" id="qreset">恢复默认</button>
  </div>
  <div class="qrow"><span>亮度</span><input id="qexpo" type="range" min="0.6" max="2.2" step="0.05" value="1.35"><b id="vexpo">1.35</b></div>
  <div class="qrow"><span>明暗</span><input id="qgamma" type="range" min="0.7" max="1.8" step="0.02" value="1.10"><b id="vgamma">1.10</b></div>
  <div class="qrow"><span>对比度</span><input id="qcon" type="range" min="0.7" max="1.4" step="0.02" value="1.05"><b id="vcon">1.05</b></div>
  <div class="qrow"><span>饱和度</span><input id="qsat" type="range" min="0" max="1.8" step="0.05" value="1.25"><b id="vsat">1.25</b></div>
  <div class="qrow"><span>色温</span><input id="qtemp" type="range" min="-1" max="1" step="0.05" value="0"><b id="vtemp">0.00</b></div>
  <div class="qrow"><span>色相</span><input id="qhue" type="range" min="-60" max="60" step="5" value="0"><b id="vhue">0°</b></div>
  <div class="meta">预览实时更新。色温往右偏暖（黄），往左偏冷（蓝）；色相整体转色偏，
    例如画面发绿就往红的方向转。参数全部在手机上算进最终四色帧，设备不用重启。</div>
</div>

<div class="card">
  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="state">连接中…</span>
  </div>
  <div class="meta" id="detail"></div>
</div>

<div class="card">
  <details>
    <summary>高级设置</summary>
    <label for="ssid">热点名称（SSID）</label>
    <input id="ssid" type="text" maxlength="32" autocomplete="off">
    <label for="pass">热点密码</label>
    <input id="pass" type="password" maxlength="64" autocomplete="new-password"
           placeholder="8 位以上；留空为开放热点">
    <div class="hint">保存后需要重启设备才会生效。改完连不上时，可在断电重连后按默认值与 NVS 里的旧配置二选一排查。</div>
    <div class="row">
      <button class="ghost" id="save">保存</button>
      <button class="ghost" id="reboot">重启设备</button>
    </div>
    <div class="meta" id="cfgmsg"></div>
  </details>
</div>

<script>
/* 手机端直接生成面板帧缓冲：768x552、2bpp、每字节 4 像素（左侧像素在高位），
 * 105,984 字节。布局与固件 epd_se0398nz07.h 的 EPD_FB_BYTES 完全一致。 */
const W = 768, H = 552;
const ROW_BYTES = W / 4;             // 192
const FB_BYTES = ROW_BYTES * H;      // 105984

/* 面板四色（sRGB 近似）：必须和固件 image_pipeline.c / docs/calibration.md 一致 */
const PAL = [[33,32,34],[204,204,198],[217,133,9],[109,31,22]];


const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
let bitmap = null, busy = false, previewTimer = 0;

const clamp = v => v < 0 ? 0 : (v > 255 ? 255 : v);
const srgbToLin = v => v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
const linToSrgb = v => {
  if (v <= 0) return 0;
  if (v >= 1) return 1;
  return v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
};

const LIN = new Float32Array(256);
for (let i = 0; i < 256; i++) LIN[i] = srgbToLin(i / 255);

/* ---------- Oklab：色域映射与误差扩散都在这个空间里算 ----------
 * 线性 RGB 里蓝色亮度极低，直接投影会被判成很暗的灰；Oklab 把亮度
 * 和色度分开，印不出来的蓝/绿只丢色度、保留明暗。 */
function linToOklab(r, g, b, out) {
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  out[0] = 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s;
  out[1] = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s;
  out[2] = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
}

/* 四色在 Oklab 里的坐标，以及凸包六条边（沿边混合 = 两种色料按比例叠加） */
const OK = (() => {
  const pal = PAL.map(c => {
    const o = [0, 0, 0];
    linToOklab(srgbToLin(c[0] / 255), srgbToLin(c[1] / 255), srgbToLin(c[2] / 255), o);
    return o;
  });
  const edges = [];
  for (let i = 0; i < 4; i++) {
    for (let j = i + 1; j < 4; j++) {
      const d = [pal[i][0] - pal[j][0], pal[i][1] - pal[j][1], pal[i][2] - pal[j][2]];
      const den = d[0] * d[0] + d[1] * d[1] + d[2] * d[2];
      edges.push({ p: pal[j], d, inv: 1 / den });
    }
  }
  return { pal, edges };
})();

function quality() {
  return {
    expo: +$('qexpo').value,
    gamma: +$('qgamma').value,
    con: +$('qcon').value,
    sat: +$('qsat').value,
    temp: +$('qtemp').value,
    hue: +$('qhue').value,
  };
}

/* sRGB 8 位 -> 调色后 sRGB 8 位（曝光/对比度/gamma 合并成一张表） */
function toneLUT(q) {
  const t = new Uint8Array(256);
  for (let i = 0; i < 256; i++) {
    let s = linToSrgb(LIN[i] * q.expo);
    s = Math.min(1, Math.max(0, 0.5 + (s - 0.5) * q.con));
    s = Math.pow(s, 1 / q.gamma);
    t[i] = Math.round(s * 255);
  }
  return t;
}

function coverParams(iw, ih) {
  const s = Math.max(W / iw, H / ih);
  const sw = W / s, sh = H / s;
  return { sx: (iw - sw) / 2, sy: (ih - sh) / 2, sw, sh };
}

/* ---------- 核心：生成最终 2bpp 帧（预览与上传是同一份数据） ----------
 *   1. cover 裁切到 768x552
 *   2. 饱和度 + 曝光/对比度/gamma（toneLUT）
 *   3. 转到 Oklab，投影到四色凸包（丢弃印不出的色度）
 *   4. Floyd–Steinberg 误差扩散，蛇形扫描
 *   5. 打包成 2bpp（每字节 4 像素，左侧像素在高位）
 * 返回耗时（秒）；结果放在 packedFrame 里。 */
let packedFrame = null;

function renderFinal() {
  if (!bitmap) return 0;
  const t0 = performance.now();

  const { sx, sy, sw, sh } = coverParams(bitmap.width, bitmap.height);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(bitmap, sx, sy, sw, sh, 0, 0, W, H);

  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;

  const q = quality();
  const tone = toneLUT(q);
  const tl = new Float32Array(256);
  for (let i = 0; i < 256; i++) tl[i] = srgbToLin(tone[i] / 255);

  const N = W * H;
  const L = new Float32Array(N), A = new Float32Array(N), B = new Float32Array(N);
  const pal = OK.pal, edges = OK.edges;
  const lab = [0, 0, 0];

  /* 色温 / 色相只在 Oklab 的色度平面上动：
   *   色相 = 旋转 (a,b)，亮度 L 不变；
   *   色温 = 沿 b 轴平移（b 正向偏黄暖，负向偏蓝冷）。 */
  const hueRad = q.hue * Math.PI / 180;
  const cosH = Math.cos(hueRad), sinH = Math.sin(hueRad);
  const dTemp = q.temp * 0.06;
  const adjust = (q.hue !== 0 || q.temp !== 0);

  for (let i = 0; i < N; i++) {
    const k = i * 4;
    const r = d[k], g = d[k + 1], b = d[k + 2];
    const luma = (299 * r + 587 * g + 114 * b + 500) / 1000 | 0;
    const ri = clamp(Math.round(luma + (r - luma) * q.sat));
    const gi = clamp(Math.round(luma + (g - luma) * q.sat));
    const bi = clamp(Math.round(luma + (b - luma) * q.sat));
    linToOklab(tl[ri], tl[gi], tl[bi], lab);
    if (adjust) {
      const a0 = lab[1], b0 = lab[2];
      lab[1] = a0 * cosH - b0 * sinH;
      lab[2] = a0 * sinH + b0 * cosH + dTemp;
    }

    let bestErr = Infinity, bl = 0, ba = 0, bb = 0;
    for (let e = 0; e < 6; e++) {
      const ed = edges[e], p = ed.p, dv = ed.d;
      let w = ((lab[0] - p[0]) * dv[0] + (lab[1] - p[1]) * dv[1] +
               (lab[2] - p[2]) * dv[2]) * ed.inv;
      w = w < 0 ? 0 : (w > 1 ? 1 : w);
      const pl = p[0] + w * dv[0], pa = p[1] + w * dv[1], pb = p[2] + w * dv[2];
      const dl = lab[0] - pl, da = lab[1] - pa, db = lab[2] - pb;
      const err = dl * dl + da * da + db * db;
      if (err < bestErr) { bestErr = err; bl = pl; ba = pa; bb = pb; }
    }
    L[i] = bl; A[i] = ba; B[i] = bb;
  }

  /* 误差扩散：cur = 本行要加的误差，nxt = 下一行；每行换方向减少条纹 */
  const CLAMP_ERR = 0.25;
  const packed = new Uint8Array(FB_BYTES);
  let curL = new Float32Array(W), curA = new Float32Array(W), curB = new Float32Array(W);
  let nxtL = new Float32Array(W), nxtA = new Float32Array(W), nxtB = new Float32Array(W);

  for (let y = 0; y < H; y++) {
    const step = (y & 1) ? -1 : 1;
    for (let n = 0, x = step > 0 ? 0 : W - 1; n < W; n++, x += step) {
      const i = y * W + x;
      const l = L[i] + curL[x], a = A[i] + curA[x], b = B[i] + curB[x];

      let k = 0, best = Infinity;
      for (let p = 0; p < 4; p++) {
        const dl = l - pal[p][0], da = a - pal[p][1], db = b - pal[p][2];
        const dd = dl * dl + da * da + db * db;
        if (dd < best) { best = dd; k = p; }
      }
      packed[(y * W + x) >> 2] |= k << (6 - 2 * (x & 3));

      let er = l - pal[k][0], ea = a - pal[k][1], eb = b - pal[k][2];
      er = er > CLAMP_ERR ? CLAMP_ERR : (er < -CLAMP_ERR ? -CLAMP_ERR : er);
      ea = ea > CLAMP_ERR ? CLAMP_ERR : (ea < -CLAMP_ERR ? -CLAMP_ERR : ea);
      eb = eb > CLAMP_ERR ? CLAMP_ERR : (eb < -CLAMP_ERR ? -CLAMP_ERR : eb);

      const xf = x + step, xl = x - step;
      if (xf >= 0 && xf < W) {
        curL[xf] += er * 0.4375; curA[xf] += ea * 0.4375; curB[xf] += eb * 0.4375;
      }
      if (y + 1 < H) {
        if (xl >= 0 && xl < W) {
          nxtL[xl] += er * 0.1875; nxtA[xl] += ea * 0.1875; nxtB[xl] += eb * 0.1875;
        }
        nxtL[x] += er * 0.3125; nxtA[x] += ea * 0.3125; nxtB[x] += eb * 0.3125;
        if (xf >= 0 && xf < W) {
          nxtL[xf] += er * 0.0625; nxtA[xf] += ea * 0.0625; nxtB[xf] += eb * 0.0625;
        }
      }
    }
    let t;
    t = curL; curL = nxtL; nxtL = t;
    t = curA; curA = nxtA; nxtA = t;
    t = curB; curB = nxtB; nxtB = t;
    nxtL.fill(0); nxtA.fill(0); nxtB.fill(0);
  }

  /* 预览直接由打包结果还原，保证看到的就是屏幕上的 */
  for (let y = 0; y < H; y++) {
    const row = y * ROW_BYTES;
    for (let x = 0; x < W; x++) {
      const code = (packed[row + (x >> 2)] >> (6 - 2 * (x & 3))) & 3;
      const i = (y * W + x) * 4;
      const c = PAL[code];
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  $('ph').style.display = 'none';
  cv.style.display = 'block';

  packedFrame = packed;
  return (performance.now() - t0) / 1000;
}

function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(renderFinal, 150);
}

/* ---------- 状态 ---------- */
const DOTS = { idle: 'ok', decoding: 'busy', refreshing: 'busy', error: 'err' };
const LABELS = { idle: '就绪', decoding: '解码中', refreshing: '刷屏中', error: '出错' };

function showStatus(s) {
  const st = s.state || 'error';
  $('dot').className = 'dot ' + (DOTS[st] || '');
  $('state').textContent = LABELS[st] || st;
  const bits = [];
  if (s.msg) bits.push(s.msg);
  if (s.src_w) bits.push(`源图 ${s.src_w}×${s.src_h}`);
  bits.push(`${s.wifi ? '热点开' : '热点关'} ${s.ssid || '?'}`);
  bits.push(`剩余内存 ${Math.round((s.heap || 0) / 1024)} KB`);
  $('detail').textContent = bits.join(' · ');
  return st;
}

async function pollStatus() {
  try {
    const r = await fetch('/status', { cache: 'no-store' });
    return showStatus(await r.json());
  } catch (e) {
    $('dot').className = 'dot err';
    $('state').textContent = '连接断开';
    return 'error';
  }
}

/* ---------- 上传 ---------- */
async function upload() {
  if (!bitmap || busy) return;
  busy = true;
  $('send').disabled = true;
  $('state').textContent = '生成四色图…';
  await new Promise(r => setTimeout(r, 30));   // 先把状态文字刷到屏幕上

  const secs = renderFinal();
  if (!packedFrame) {
    $('state').textContent = '生成失败，换一张试试';
    $('dot').className = 'dot err';
    busy = false; $('send').disabled = false;
    return;
  }
  $('size').textContent =
    `四色帧 ${FB_BYTES / 1024 | 0} KB · 本机渲染 ${secs.toFixed(2)} s`;
  $('state').textContent = '上传中…';

  try {
    const r = await fetch('/upload/raw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: packedFrame
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.msg || ('HTTP ' + r.status));
  } catch (e) {
    $('state').textContent = '上传失败：' + e.message;
    $('dot').className = 'dot err';
    busy = false; $('send').disabled = false;
    return;
  }

  // 轮询直到刷完
  const t0 = Date.now();
  let sawBusy = false;
  await new Promise(done => {
    const t = setInterval(async () => {
      const st = await pollStatus();
      if (st === 'decoding' || st === 'refreshing') sawBusy = true;
      const finished = sawBusy && (st === 'idle' || st === 'error');
      if (finished || Date.now() - t0 > 45000) {
        clearInterval(t);
        done();
      }
    }, 1200);
  });

  busy = false;
  $('send').disabled = false;
}

/* ---------- 事件 ---------- */
$('file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  try {
    try {
      bitmap = await createImageBitmap(f, { imageOrientation: 'from-image' });
    } catch (_) {
      bitmap = await createImageBitmap(f);
    }
  } catch (err) {
    $('state').textContent = '无法读取这张图片';
    return;
  }
  renderFinal();
  $('size').textContent = `${f.name} · ${bitmap.width}×${bitmap.height}`;
  $('send').disabled = false;
});

$('send').addEventListener('click', upload);

/* ---------- 画质滑块 ---------- */
const QSLIDERS = [
  ['qexpo', 'vexpo', v => v.toFixed(2)],
  ['qgamma', 'vgamma', v => v.toFixed(2)],
  ['qcon', 'vcon', v => v.toFixed(2)],
  ['qsat', 'vsat', v => v.toFixed(2)],
  ['qtemp', 'vtemp', v => v.toFixed(2)],
  ['qhue', 'vhue', v => `${v.toFixed(0)}°`],
];
const QDEFAULT = {
  qexpo: 1.35, qgamma: 1.10, qcon: 1.05, qsat: 1.25, qtemp: 0, qhue: 0,
};

function syncQLabels() {
  for (const [id, out, fmt] of QSLIDERS) {
    $(out).textContent = fmt(+$(id).value);
  }
}

function saveQuality() {
  try { localStorage.setItem('epdQuality', JSON.stringify(quality())); } catch (_) {}
}

for (const [id] of QSLIDERS) {
  $(id).addEventListener('input', () => { syncQLabels(); saveQuality(); schedulePreview(); });
}

$('qreset').addEventListener('click', () => {
  for (const [id] of QSLIDERS) $(id).value = QDEFAULT[id];
  syncQLabels();
  saveQuality();
  schedulePreview();
});

/* 上次调好的参数存在浏览器里，刷新页面不用重调 */
try {
  const saved = JSON.parse(localStorage.getItem('epdQuality') || '{}');
  const map = {
    qexpo: 'expo', qgamma: 'gamma', qcon: 'con', qsat: 'sat',
    qtemp: 'temp', qhue: 'hue',
  };
  for (const [id, key] of Object.entries(map)) {
    if (typeof saved[key] === 'number') $(id).value = saved[key];
  }
} catch (_) {}

syncQLabels();

$('save').addEventListener('click', async () => {
  const body = new URLSearchParams({ ssid: $('ssid').value.trim(), password: $('pass').value });
  try {
    const r = await fetch('/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    const j = await r.json();
    $('cfgmsg').textContent = j.msg || (j.ok ? '已保存' : '保存失败');
  } catch (e) {
    $('cfgmsg').textContent = '保存失败：' + e.message;
  }
});

$('reboot').addEventListener('click', async () => {
  if (!confirm('确定重启设备？')) return;
  await fetch('/reboot', { method: 'POST' }).catch(() => {});
  $('cfgmsg').textContent = '设备正在重启，稍等约 5 秒后刷新本页';
});

/* ---------- 初始化 ---------- */
(async () => {
  const s = await fetch('/status', { cache: 'no-store' }).then(r => r.json()).catch(() => null);
  if (s) {
    showStatus(s);
    $('ssid').value = s.ssid || '';
  }
  setInterval(() => { if (!busy) pollStatus(); }, 5000);
})();
</script>
</body>
</html>
